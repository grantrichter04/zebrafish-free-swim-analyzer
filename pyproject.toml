[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-analyzer"
description = "Behavioural analysis of zebrafish free-swimming assays tracked with idtracker.ai"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

# The only dependency list. environment.yml installs from here.
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "traja==25.0.1",
    # traja imports sklearn unconditionally but does not declare it, so
    # `import traja` fails without this. Not optional.
    "scikit-learn>=1.0",
    # Functionally optional - without them thigmotaxis and the video inspector
    # are disabled rather than crashing - but installed by default because
    # nearly every workflow uses them.
    "shapely>=2.0",
    # Headless, not opencv-python: idtracker.ai installs the headless build
    # and the two cannot share an environment. Nothing here opens a cv2 window.
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "pytest>=7.0",
]
# pip install -e ".[tracking]" - adds idtracker.ai for the Tracking tab.
# Install GPU PyTorch first; see install.bat.
tracking = [
    "idtrackerai>=6.0.14,<6.1",
]
# The standalone scripts under extras/head_detection/ and extras/fish_posture_analyzer.py.
# idtrackerai itself is not listed: install it per idtracker.ai's own docs.
standalone = [
    "scikit-image>=0.19",
]

[project.scripts]
fish-analyzer = "fish_analyzer.__main__:main"

[tool.setuptools]
# Explicit, so the standalone extras/head_detection/ scripts are not swept in as
# though they were part of the package.
packages = ["fish_analyzer", "fish_analyzer.gui"]

[tool.setuptools.dynamic]
version = { attr = "fish_analyzer.__version__" }
